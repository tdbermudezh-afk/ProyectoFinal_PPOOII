spring.application.name=proyecto
server.port=9001

# Conexión a MySQL en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/PPOOII_Proyecto?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate (Laboratorio 1)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.hibernate.ddl-auto=update
spring.data.jpa.repositories.enabled=true

# Habilitar/deshabilitar api-docs y swagger-ui (Laboratorio 4)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.override-with-generic-response=false

# Definir la ruta de swagger-ui y api-docs (Laboratorio 4)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Seleccionar paquetes y rutas a escanear en la documentación (Laboratorio 4)
springdoc.packagesToScan=com.PPOOII.proyecto.controllers
springdoc.pathsToMatch=/api/**, /authenticate

# Configuración de API Externa Google Maps para Geocoding y Front-End (Entrega 3 / Laboratorio 3)
