spring.application.name=proyecto
server.port=9001

# Conexión a MySQL en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/PPOOII_Proyecto?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
springdoc.override-with-generic-response=false
spring.jpa.hibernate.ddl-auto=update

# Configuración de API Externa Google Maps para Geocoding y Front-End (Entrega 3)
# Puedes colocar aquí tu API Key cuando desees habilitar las llamadas reales a Google Maps
google.maps.api.key=AIzaSyDVc25acw8DaycktmcCdJ0Res5Pq0HynA0

# RabbitMQ Configuración
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.queue=cola_vehiculos_alertas
app.rabbitmq.exchange=exchange_vehiculos
app.rabbitmq.routingkey=routingkey_vehiculos

